  <metadata>Original app icon for Pixel Backup.</metadata>
  <defs>
    <mask id="landscape" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="white"/>
      <path fill="black" d="M20.5 44 28 34.3q1.1-1.4 2.2 0l4.7 5.5 4-4.6q1-1.2 2 0l7.6 8.8Z"/>
      <circle cx="45.5" cy="29.5" r="3.6" fill="black"/>
    </mask>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14.5" fill="#618572"/>
  <rect x="2.4" y="2.4" width="59.2" height="59.2" rx="13.1" fill="#173E31"/>
  <g mask="url(#landscape)">
    <rect x="10.5" y="15" width="38" height="27" rx="3.6"
          transform="rotate(-12 29.5 28.5)" fill="#84B79B"/>
    <rect x="13" y="19" width="45" height="34.5" rx="6.5" fill="#173E31"/>
    <rect x="15.5" y="21.5" width="40" height="29.5" rx="4" fill="#D5F2D8"/>
